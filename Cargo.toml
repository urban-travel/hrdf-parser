[package]
name = "hrdf-parser"
version = "0.13.0"
edition = "2024"
description = "Parses the routing-relevant part of Swiss HRDF timetables."
repository = "https://github.com/urban-travel/hrdf-parser"
license-file = "LICENSE"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
postcard = { version = "1.1.3", features = ["use-std"] }
reqwest = "0.13.5"
rustc-hash = "2.1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.20"
zip = "8.6.0"

[dev-dependencies]
simple_logger = "5.2.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
opt-level = 3
